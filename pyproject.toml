[project]
name = "ModuFlexGUI"
version = "0.0.1b5"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.1",
    "flet_android_notifications"
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.1",
    "flet-desktop>=1.0.1",
    "flet-web>=1.0.1",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.1",
    "flet-android-notifications"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.flexyyyapk213"
product = "ModuFlexGUI"
company = "flexyyyapk213"
copyright = "Copyright (C) 2026 by ModuFlexGUI"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true
"android.permission.IGNORE_BATTERY_OPTIMIZATIONS" = true