name: Build Android APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Creating an intermediate Flutter project
        run: flet build apk -v --yes --force

      - name: Patch the manifest
        run: |
          flet-android-notifications-patch \
          --project-root build/flutter \
          --foreground-service-type specialUse \
          --foreground-service-subtype "Maintaining ModuFlex Telegram connection"

      - name: Build universal APK
        working-directory: build/flutter
        run: |
          flutter build apk --release

      - name: Build Split APKs
        working-directory: build/flutter
        run: flutter build apk -v --split-per-abi --release

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DATE=$(date -u +'%Y-%m-%d')
          BUILD_NUM="${{ github.run_number }}"
          APK_DIR="build/flutter/build/app/outputs/flutter-apk"

          mkdir -p release_apk

          cp "$APK_DIR/app-release.apk" \
            "release_apk/ModuFlexGUI-universal-b${BUILD_NUM}_${BUILD_DATE}.apk"

          for apk in "$APK_DIR"/app-*-release.apk; do
            [ -e "$apk" ] || continue

            filename=$(basename "$apk")
            abi="${filename#app-}"
            abi="${abi%-release.apk}"

            cp "$apk" \
              "release_apk/ModuFlexGUI-${abi}-b${BUILD_NUM}_${BUILD_DATE}.apk"
          done

          ls -lh release_apk

      - name: Upload APKs to created Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
